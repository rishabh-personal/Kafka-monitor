name: kafka-connector-monitor

services:
  - name: web
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_size_slug: basic-xxs   # cheapest tier (~$5/mo)
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: UI_PASSWORD
        type: SECRET
      - key: SESSION_SECRET
        type: SECRET
      - key: KAFKA_UI_URL
        value: "https://jio-kafka-ui.prod.zwing.in"
      - key: KAFKA_UI_SESSION_COOKIE
        type: SECRET
        # Sign in to Kafbat via GitHub, copy SESSION cookie from browser DevTools
      - key: CLUSTER_NAME
        value: "kafka-prod"
      - key: SLACK_WEBHOOK
        type: SECRET
        # Set value in DigitalOcean Console: App → Settings → Environment Variables
      - key: APP_URL
        value: "https://your-app.ondigitalocean.app"
      - key: CHECK_INTERVAL
        value: "*/15 * * * *"
      # Debezium topic verification (omit or "true" = enabled; "false" = disabled)
      - key: CHECK_DEBEZIUM_TOPICS
        value: "true"
      - key: LAG_VELOCITY_THRESHOLD
        value: "5000"
      - key: CHECK_ORPHAN_TOPICS
        value: "true"
